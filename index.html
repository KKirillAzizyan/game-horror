<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Голодные Пустоши — Выживание</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="game"></canvas>

    <!-- Левая панель: статы -->
    <div id="hud-stats">
        <div class="stat">
            <span class="stat-ico">❤️</span>
            <div class="stat-bar"><div id="bar-hp" class="fill fill-hp"></div></div>
            <span id="num-hp" class="stat-num">100</span>
        </div>
        <div class="stat">
            <span class="stat-ico">🍖</span>
            <div class="stat-bar"><div id="bar-hunger" class="fill fill-hunger"></div></div>
            <span id="num-hunger" class="stat-num">100</span>
        </div>
        <div class="stat">
            <span class="stat-ico">🧠</span>
            <div class="stat-bar"><div id="bar-sanity" class="fill fill-sanity"></div></div>
            <span id="num-sanity" class="stat-num">100</span>
        </div>
    </div>

    <!-- Верх: время суток -->
    <div id="hud-clock">
        <div id="clock-ico">☀️</div>
        <div id="clock-day">День 1</div>
        <div id="clock-phase">Утро</div>
    </div>

    <!-- Низ: инвентарь -->
    <div id="hud-inventory">
        <div id="inv-slots"></div>
    </div>

    <!-- Подсказка под курсором -->
    <div id="tooltip" class="hidden"></div>

    <!-- Сообщения -->
    <div id="toast"></div>

    <!-- Панель крафта -->
    <div id="craft-panel" class="hidden">
        <div class="panel-head">
            <span>Создание предметов</span>
            <button id="craft-close">✕</button>
        </div>
        <div id="craft-list"></div>
    </div>

    <!-- Стартовый экран -->
    <div id="start-screen">
        <h1>ГОЛОДНЫЕ ПУСТОШИ</h1>
        <p class="tagline">Выживи. Добывай. Создавай. Переживи ночь.</p>
        <div class="controls">
            <div><b>W A S D</b> — движение</div>
            <div><b>Мышь</b> — прицел · <b>ЛКМ</b> — удар / сбор / еда</div>
            <div><b>E</b> — инвентарь · <b>C</b> — крафт</div>
            <div><b>Пробел</b> — рывок (спринт)</div>
        </div>
        <button id="btn-start">НАЧАТЬ ВЫЖИВАНИЕ</button>
    </div>

    <!-- Экран смерти -->
    <div id="death-screen" class="hidden">
        <h1>ВЫ ПОГИБЛИ</h1>
        <p id="death-reason">Голод свалил вас.</p>
        <p id="death-stats">Продержались: 1 день</p>
        <button id="btn-restart">ПОПРОБОВАТЬ СНОВА</button>
    </div>

    <!-- Крафт-кнопка -->
    <button id="btn-craft-toggle" class="hidden" title="Крафт (C)">🛠️</button>

    <script src="game.js"></script>
</body>
</html>
